<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1eb">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("sg.theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme="light";}</script>
<title>SafheGardan</title>
<link rel="icon" href="data:,">
<script>window.__sgInsets=function(t,r,b,l){var s=document.documentElement.style,p=function(v){return (+v||0)+'px';};s.setProperty('--sat',p(t));s.setProperty('--sar',p(r));s.setProperty('--sab',p(b));s.setProperty('--sal',p(l));window.dispatchEvent(new Event('resize'));};try{if(window.SGNative&&SGNative.insets){var i=JSON.parse(SGNative.insets());window.__sgInsets(i.t,i.r,i.b,i.l);document.documentElement.classList.add('android');}}catch(e){}</script>
<script src="js/diag.js"></script>
<link href="vendor/fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{"imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
}}
</script>
</head>
<body data-tab="collection" data-sheet="peek">
<canvas id="gl" aria-label="3D scene"></canvas>
<div class="loading" id="loading">
  <div class="spinrec" aria-hidden="true"><i></i></div>
  <div class="brand big">Safhe<span>gardan</span></div>
  <small id="loadMsg">Setting out the records…</small>
</div>

<header class="top">
  <div class="brand">Safhe<span>gardan</span></div>
  <div class="topR">
    <div class="mini" id="mini" role="button" tabindex="0" hidden aria-label="Now playing — open the turntable"><i class="mini-disc" id="miniDisc"></i><span class="mini-title" id="miniTitle"></span><button class="mini-tg" id="miniTg" aria-label="Play or pause"></button></div>
    <div class="wallet" title="Demo credit — no real payments">Credit<b id="wallet">$0</b></div>
    <button class="themeBtn" id="themeBtn" aria-label="Switch between day and night"><svg class="ico moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg><svg class="ico sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
  </div>
</header>

<div class="hud" id="hud"></div>
<div class="dots" id="dots"></div>
<div class="coach" id="coach" aria-live="polite"><i></i><span></span></div>
<button class="shotctl" id="shotctl" aria-label="Next camera angle"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5A1.5 1.5 0 014.5 7h2.2l1.5-2h7.6l1.5 2h2.2A1.5 1.5 0 0121 8.5v9a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg><span id="shotN">1</span><b id="shotOf">/4</b></button>
<div class="shotcap" id="shotcap" aria-live="polite"><small>Camera</small><span id="shotName"></span></div>
<div class="zoomctl" id="zoomctl" role="toolbar" aria-label="View">
  <button data-z="out" aria-label="Zoom out"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
  <button data-z="reset" aria-label="Reset zoom" id="zoomReset">1×</button>
  <button data-z="in" aria-label="Zoom in"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <i class="sep" aria-hidden="true"></i>
  <button data-z="fx" aria-label="Rendering quality" id="fxBtn">FX</button>
</div>

<section class="sheet" id="sheetWrap" data-size="peek" aria-label="Controls">
  <button class="grabber" id="grabber" aria-label="Expand panel" aria-expanded="false"><i></i></button>
  <button class="sheetMin" id="sheetMin" aria-label="Collapse panel" aria-expanded="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  <div class="sheet-body" id="sheet"></div>
  <div class="sheet-foot" id="sheetFoot"></div>
</section>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <i class="tab-ind" aria-hidden="true"></i>
  <button data-tab="collection" class="on" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="11" rx="2"/><path d="M7 9V5h10v4"/></svg>Crates</button>
  <button data-tab="deck"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="10" cy="12" r="4"/><path d="M17 8l-2 6"/></svg>Turntable</button>
  <button data-tab="studio"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 4v2M20 12h-2"/></svg>Studio</button>
  <button data-tab="shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 016 0"/></svg>Shop</button>
  <button data-tab="you"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.8 20a7.2 7.2 0 0114.4 0"/></svg>You</button>
</nav>

<div class="modal" id="modal"><div class="modal-card" id="modalCard" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/catalog.js"></script>
<script src="js/localmedia.js"></script>
<script src="js/ownmedia.js"></script>
<script src="js/audius.js"></script>
<script src="js/archive.js"></script>
<script src="js/sources.js"></script>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/engine.js"></script>
<script type="module" src="js/world.js"></script>
<script src="js/app.js"></script>
</body>
</html>
